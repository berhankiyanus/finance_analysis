[pytest]
# Pytest yapılandırması

# Test dizinleri
testpaths = tests

# Python dosyaları
python_files = test_*.py

# Python fonksiyonları
python_functions = test_*

# Python sınıfları
python_classes = Test*

# Marker'lar
markers =
    slow: yavaş testler (gerçek API çağrıları)
    integration: entegrasyon testleri
    unit: birim testleri (mock'lu, hızlı)

# Test keşfi ayarları
norecursedirs = .git .venv venv __pycache__ *.egg-info

# Timeout (yavaş testler için)
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (opsiyonel)
# addopts = --cov=src --cov-report=html --cov-report=term

# Verbose output
addopts = -v --tb=short

