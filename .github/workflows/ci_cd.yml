name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Backtests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run backtest tests
      run: |
        # Backtest testlerini çalıştır (eğer varsa)
        if [ -f "tests/test_backtest.py" ]; then
          pytest tests/test_backtest.py -v
        else
          echo "⚠️  Backtest test dosyası bulunamadı, test atlanıyor."
        fi
    
    - name: Run basic import tests
      run: |
        python -c "from src.prediction_model import PriceDirectionPredictor; print('✅ Import başarılı')"
        python -c "from src.financial_analysis import compute_features; print('✅ Import başarılı')"
        python -c "from src.sentiment_analysis import SentimentAnalyzer; print('✅ Import başarılı')"

  deploy:
    name: Deploy to Streamlit Cloud
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to Streamlit Cloud
      uses: streamlit/streamlit-cloud-action@v1
      with:
        streamlit_token: ${{ secrets.STREAMLIT_TOKEN }}
        app_path: app.py

  # Otomatik Model Yeniden Eğitimi (Haftalık - Pazar gecesi)
  retrain_models:
    name: Otomatik Model Yeniden Eğitimi
    runs-on: ubuntu-latest
    # Her Pazar gecesi 02:00 UTC'de çalış (cron: dakika saat gün ay hafta)
    # schedule:
    #   - cron: '0 2 * * 0'  # Her Pazar gecesi 02:00 UTC
    # Manuel tetikleme için (şimdilik)
    if: false  # Otomatik çalışmasını istemiyorsanız false yapın
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Eğitilecek Modeller Listesi
      run: |
        echo "THYAO,EREGL,TUPRS,GARAN,AKBNK" > models_to_train.txt
    
    - name: Modelleri Yeniden Eğit
      run: |
        python scripts/auto_retrain.py --ticker THYAO --period 2y --model-type random_forest || echo "THYAO eğitimi başarısız"
        python scripts/auto_retrain.py --ticker EREGL --period 2y --model-type random_forest || echo "EREGL eğitimi başarısız"
        python scripts/auto_retrain.py --ticker TUPRS --period 2y --model-type random_forest || echo "TUPRS eğitimi başarısız"
    
    - name: Model Artifact'larını Yükle
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: trained-models
        path: models/*.pkl
        retention-days: 30

